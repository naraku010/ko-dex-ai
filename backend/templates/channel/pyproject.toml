[project]
name = "example-channel"
version = "1.0.0"
description = "새 채널"
requires-python = ">=3.11"
dependencies = [
    "channelkit",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
example-channel = "example_channel.main:run"

[tool.uv.sources]
channelkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_channel"]
