[project]
name = "egi-console"
version = "1.0.0"
description = "채널 관제. git 갱신과 NSSM 시작/중지를 한 화면에서 한다."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
egi-console = "egi_console.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egi_console"]
