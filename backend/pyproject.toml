[project]
name = "kodex-channel"
version = "0.1.0"
description = "kodex.channel/v1 채널 서버 모음. 루트에서 채널 하나를 띄운다."
requires-python = ">=3.11"
# 채널 패키지는 workspace 멤버(channels/*)라 uv sync --all-packages 로 함께 깔린다.
# 여기에 채널 이름을 적으면 그 폴더가 없는 저장소에서 sync가 깨진다.
dependencies = []

[project.scripts]
kodex-channel = "kodex_channel.cli:main"

[tool.uv.workspace]
members = ["packages/*", "channels/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kodex_channel"]
